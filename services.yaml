---
# ── Top row ──────────────────────────────────────────────────────

- Infrastructure:
      - Proxmox:
            href: "http://proxmox.home:8006"
            description: Proxmox Server
            icon: "si-proxmox"
            widget:
                type: proxmox
                url: "https://proxmox.home:8006"
                username: "homepage@pam!homepage"
                password: "{{HOMEPAGE_VAR_PROXMOX}}"
                verify_ssl: false
                node: proxmox

      - Proxmox Backup:
            href: "http://backup.home:8007"
            description: Proxmox Backup Server
            icon: "si-proxmox"
            widget:
                type: proxmoxbackupserver
                url: "https://backup.home:8007"
                username: "root@pam!homepage"
                password: "{{HOMEPAGE_VAR_PBS}}"
                verify_ssl: false

      - TrueNAS:
            href: "http://truenas.home"
            description: TrueNAS Storage
            icon: "si-truenas"
            widget:
                type: truenas
                url: "http://truenas.home"
                username: "truenas_admin"
                password: "{{HOMEPAGE_VAR_PASSWORD}}"
                enablePools: true
                version: 2

      - TrueNAS Lake:
            href: "http://truenaslake.lake"
            description: TrueNAS Storage - Lake
            icon: "si-truenas"
            widget:
                type: truenas
                url: "http://truenaslake.lake"
                username: "truenas_admin"
                password: "{{HOMEPAGE_VAR_PASSWORD}}"
                enablePools: true
                version: 2

      - Arcane:
            href: "http://docker.home:3552"
            description: Docker Dashboard
            icon: "si-docker"
            server: docker
            container: arcane
            widget:
                type: arcane
                url: "http://docker.home:3552"
                env: 0
                key: "{{HOMEPAGE_VAR_ARCANE}}"
                fields: ["running", "stopped", "image_updates", "images_unused"]

      - Borg:
            href: "http://borg.home:8081"
            description: Borg Backup Server
            icon: "si-borgbackup"
            ping: borg.home

      - Ansible:
            href: "http://semaphore.home:3000"
            description: Ansible Dashboard
            icon: "si-ansible"
            proxmoxNode: proxmox
            proxmoxVMID: 122
            proxmoxType: lxc

      # - Patchmon:
      #       href: "http://patchmon.home:3000"
      #       description: Patch Management Dashboard
      #       icon: "si-packer"
      #       proxmoxNode: proxmox
      #       proxmoxVMID: 125
      #       proxmoxType: lxc

- Network:
      - Unifi Controller:
            href: "https://unifi.ui.com/"
            description: Unifi Network Controller
            icon: "si-ubiquiti"
            widget:
                type: unifi
                url: "https://192.168.1.1"
                key: "{{HOMEPAGE_VAR_UNIFI}}"

      - Technitium:
            href: "http://192.168.1.10:5380"
            description: DHCP and DNS Server
            icon: "si-dash"
            server: dockerpi
            container: technitium-dns1
            widget:
                type: technitium
                url: "http://192.168.1.10:5380"
                key: "{{HOMEPAGE_VAR_TECHNITIUM}}"
                range: LastDay
                fields: ["totalQueries", "totalClients", "totalBlocked"]

      - Speedtest:
            href: "http://speedtest.home"
            description: Speedtest CLI
            icon: "si-speedtest"
            proxmoxNode: proxmox
            proxmoxVMID: 109
            proxmoxType: lxc
            widget:
                type: speedtest
                url: "http://speedtest.home"
                bitratePrecision: 2
                key: "{{HOMEPAGE_VAR_SPEEDTEST}}"

      - Speedtest Lake:
            href: "http://truenaslake.lake:8080/"
            description: Speedtest CLI Lake
            icon: "si-speedtest"
            # server: dockerlake
            # container: speedtest-tracker
            widget:
                type: speedtest
                url: "http://truenaslake.lake:8080/"
                bitratePrecision: 2
                key: "{{HOMEPAGE_VAR_SPEEDTEST_LAKE}}"

      - Homelable:
            icon: si-homebridge
            ping: homelable.home
            description: Home Network Visualizer
            href: http://homelable.home:3000

      - Grafana:
            href: "http://tensor.home:3000"
            description: Observability Dashboards
            icon: si-grafana
            widget:
                type: grafana
                version: 2 # optional, default is 1
                url: http://tensor.home:3000
                username: "admin"
                password: "{{HOMEPAGE_VAR_PASSWORD}}"
                fields: ["dashboards", "datasources", "totalalerts"]

      - Pulse:
            href: "http://pulse.home:7655"
            description: Network Monitoring
            icon: "si-puppet"
            proxmoxNode: proxmox
            proxmoxVMID: 123
            proxmoxType: lxc
            widgets:
                - type: customapi
                  url: http://pulse.home:7655/api/resources/stats
                  headers:
                      X-API-Token: "{{HOMEPAGE_VAR_PULSE}}"
                  mappings:
                      - field: byType.agent
                        label: Nodes
                        format: number
                      - field: byType.vm
                        label: VMs
                        format: number
                      - field: byType.system-container
                        label: LXCs
                        format: number
                - type: customapi
                  url: http://pulse.home:7655/api/resources/stats
                  headers:
                      X-API-Token: "{{HOMEPAGE_VAR_PULSE}}"
                  mappings:
                      - field: byType.app-container
                        label: Docker
                        format: number
                      - field: byType.storage
                        label: Storage
                        format: number
                      - field: byStatus.warning
                        label: Alerts
                        format: number
      - Victoria Logs:
            href: "http://tensor.home:9428/select/vmui"
            description: Victoria Logs
            icon: "si-victoriametrics"
            # server: tensor
            # container: victoria-logs


- Arr:
