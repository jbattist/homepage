            icon: "si-abdownloadmanager"
            proxmoxNode: proxmox
            proxmoxVMID: 103
            proxmoxType: lxc
            widget:
                type: sabnzbd
                url: "http://sabnzbd.home:7777"
                key: "{{HOMEPAGE_VAR_SABNZBD}}"
      - Prowlarr:
            href: "http://prowlarr.home:9696"
            description: Indexer Manager
            icon: "si-poly"
            proxmoxNode: proxmox
            proxmoxVMID: 132
            proxmoxType: lxc
            widget:
                type: prowlarr
                url: "http://prowlarr.home:9696"
                key: "{{HOMEPAGE_VAR_PROWLARR}}"
                fields:
                    ["numberOfGrabs", "numberOfQueries", "numberOfFailGrabs"]
      - Seerr:
            href: "http://seerr.home:5055"
            description: Media Library Manager
            icon: "si-searxng"
            proxmoxNode: proxmox
            proxmoxVMID: 132
            proxmoxType: lxc
            widget:
                type: seerr
                url: "http://seerr.home:5055"
                key: "{{HOMEPAGE_VAR_SEERR}}"
                fields:
                    ["pending", "available", "issues"]

